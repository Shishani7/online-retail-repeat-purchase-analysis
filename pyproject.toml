[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retail-repeat-analysis"
version = "0.2.0"
description = "Customer retention analytics, a dashboard and a temporally validated scoring API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<2.4", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "seaborn>=0.13,<1",
  "scikit-learn>=1.5,<2", "scipy>=1.14,<2", "openpyxl>=3.1,<4", "joblib>=1.4,<2",
  "streamlit>=1.40,<2", "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
notebook = ["jupyter>=1.1,<2", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7.16,<8", "ipykernel>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/retail_repeat_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["notebooks"]
